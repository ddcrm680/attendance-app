# Railway build config for the Laravel API.
# Railway auto-detects nixpacks.toml — no dashboard build-command setup needed.

[phases.setup]
nixPkgs = ["php83", "php83Packages.composer"]

[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader"]

[phases.build]
cmds = [
  "php artisan config:cache",
  "php artisan route:cache",
]

[start]
# The Railway volume must be mounted at /data. The SQLite file is created there
# before migrations so it persists across deployments.
cmd = "mkdir -p /data && touch /data/database.sqlite && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
